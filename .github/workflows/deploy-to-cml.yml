name: Deploy to Cloudera AI (CML) Workbench

# Modeled on the sibling repos' pipelines (cai-eval-platform, ray-serve-cai).
# Chain: setup project (from this git repo) -> create jobs -> trigger git_sync
#        (CML auto-runs Build App; we wait for it) -> create/restart Application.
#
# Required repo secrets:
#   CML_HOST            https://ml-xxxx.cloudera.site
#   CML_API_KEY         CML API v2 key (User Settings -> API Keys)
#   RUNTIME_IDENTIFIER  a Node 20+ ML Runtime identifier (stock runtimes are Python)
#   ADMIN_TOKEN         admin secret for the app (Bearer / cookie auth)
# Optional repo secrets:
#   GH_PAT              PAT so CML can clone a private repo
#   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL   Stage-2 cockpit LLM (OpenAI-compatible)
#   DATABASE_URL        Postgres; if set, used instead of SQLite

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Application subdomain (a-z0-9-)'
        required: false
        default: 'ucd-survey'
        type: string
  push:
    branches: [main]

jobs:
  # Fail fast (seconds, before any build) if required repo secrets are missing —
  # GitHub Actions does not enforce secret presence on its own. ADMIN_TOKEN is set
  # here, as a repo secret, so the CI/CD path is the default way to configure it.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required secrets are set
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          RUNTIME_IDENTIFIER: ${{ secrets.RUNTIME_IDENTIFIER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          for v in CML_HOST CML_API_KEY RUNTIME_IDENTIFIER ADMIN_TOKEN; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions, e.g.:" >> "$GITHUB_STEP_SUMMARY"
            echo '  gh secret set ADMIN_TOKEN --body "$(openssl rand -hex 24)"' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required secrets present."

  setup-project:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      project_id: ${{ steps.setup.outputs.project_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Setup CML project (from this git repo)
        id: setup
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NAME: "AI Use Case Discovery"
        run: |
          python cai_integration/setup_project.py
          echo "project_id=$(cat /tmp/project_id.txt)" >> "$GITHUB_OUTPUT"

  create-jobs:
    needs: setup-project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Create CML jobs (git_sync -> build -> launch)
        # App config is baked into the "Launch Application" job's environment so the
        # chain can be run from the CML UI and produce a live app.
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          RUNTIME_IDENTIFIER: ${{ secrets.RUNTIME_IDENTIFIER }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          APP_SUBDOMAIN: ${{ github.event.inputs.subdomain || 'ucd-survey' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cai_integration/create_jobs.py --project-id ${{ needs.setup-project.outputs.project_id }}

  run-chain:
    needs: [setup-project, create-jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 55   # git_sync + Build App (npm install + next build) + Launch Application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pyyaml
      - name: Run the chain (git_sync -> build -> launch) and wait
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
        run: python cai_integration/trigger_jobs.py --project-id ${{ needs.setup-project.outputs.project_id }}
      - name: Summary
        if: always()
        run: |
          {
            echo "## CML Deploy — ${{ job.status }}"
            echo "- Project: \`${{ needs.setup-project.outputs.project_id }}\`"
            echo "- Chain: git_sync → Build App → Launch Application (all CML Jobs)"
            echo "- App script: \`cai_integration/start_app.py\` → \`start-app.sh\` (next start on \$CDSW_APP_PORT)"
            echo "- Auth: Workbench SSO (bypass_authentication=False)"
            echo "- App URL: see the **Launch Application** job log / the CML Applications page."
          } >> "$GITHUB_STEP_SUMMARY"
