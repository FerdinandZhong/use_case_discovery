# AI Use Case Discovery — CML Job Chain
#
# Job dependency order (CML auto-triggers each child when its parent succeeds):
#   git_sync            pull latest code into the project working copy
#     → build           npm ci && npm run build  (pre-bake so the app starts fast)
#
# After `build` succeeds, launch the CML Application (one-time; it then serves
# every restart in seconds via `next start`, no rebuild):
#   - local / CI:  python cai_integration/deploy_application.py --host ... --api-key ... \
#                      --project-id ... --admin-token ... --runtime-identifier <node-runtime>
#   - CML UI:      Applications → New Application → script: cai_integration/start_app.py
#
# All jobs need a Node 20+ ML Runtime (npm + git on PATH). Pass it as the
# RUNTIME_IDENTIFIER env var to create_jobs.py, or set runtime_identifier per job below.

jobs:
  git_sync:
    name: "Git Repository Sync"
    script: "cai_integration/git_sync.py"
    parent_job_key: null
    timeout: 300       # git fetch + reset; < 2 min
    cpu: 1
    memory: 4
    description: "Pull latest code from the git remote into the CML project"

  build:
    name: "Build App"
    script: "cai_integration/build_app.py"
    parent_job_key: "git_sync"
    timeout: 1800      # 30 min ceiling: npm ci + next build
    cpu: 4
    memory: 16
    description: "npm ci && npm run build so the Application starts without building"
