# AI Use Case Discovery — CML Job Chain
#
# Job dependency order (parent→child; run "Git Repository Sync" and CML cascades):
#   git_sync            pull latest code into the project working copy
#     → build           npm install && npm run build  (pre-bake so the app starts fast)
#       → launch        create/replace the CML Application + wait for it to run
#
# So the whole deploy is triggerable from the CML Jobs UI — no external script needed.
# (trigger_jobs.py also walks this chain for CI, triggering each step explicitly if CML
# doesn't auto-fire the child.)
#
# Any ML Runtime works (stock Python is fine — ensure_node.sh installs Node if npm is
# absent). Pass its id as RUNTIME_IDENTIFIER to create_jobs.py; that also becomes the
# Application's runtime via the launch job's environment.

jobs:
  git_sync:
    name: "Git Repository Sync"
    script: "cai_integration/git_sync.py"
    parent_job_key: null
    timeout: 300       # git fetch + reset; < 2 min
    cpu: 1
    memory: 4
    description: "Pull latest code from the git remote into the CML project"

  build:
    name: "Build App"
    script: "cai_integration/build_app.py"
    parent_job_key: "git_sync"
    timeout: 1800      # 30 min ceiling: npm install + next build
    cpu: 4
    memory: 16
    description: "npm install && npm run build so the Application starts without building"

  launch:
    name: "Launch Application"
    script: "cai_integration/launch_app.py"
    parent_job_key: "build"
    timeout: 600       # create/replace the Application + wait for it to reach running
    cpu: 1
    memory: 4
    description: "Create (or replace) the CML Application and wait for it to run"
    # `environment` (ADMIN_TOKEN, RUNTIME_IDENTIFIER, APP_SUBDOMAIN, LLM_*, DATABASE_URL)
    # is injected by create_jobs.py from the create-time env so the app config travels
    # with the job — this is what lets a UI user run the chain and get a live app.
